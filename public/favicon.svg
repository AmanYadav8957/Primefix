<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pmf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pmf-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="pmf-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Modern Rounded Emblem Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#pmf-bg)" filter="url(#pmf-glow)" />

  <!-- Stylized Geometric 'P' Mark with Tech Precision Accent -->
  <!-- Stem -->
  <rect x="15" y="14" width="8" height="36" rx="3" fill="#ffffff" />
  
  <!-- Outer Loop & Tech Precision Arc -->
  <path d="M21 14 H35 C42.732 14 49 20.268 49 28 C49 35.732 42.732 42 35 42 H21 V34 H35 C38.314 34 41 31.314 41 28 C41 24.686 38.314 22 35 22 H21 V14 Z" fill="#ffffff" />

  <!-- High-Tech Cyan Inset Accent & Energy Core -->
  <path d="M25 22 H35 C38.314 22 41 24.686 41 28 C41 31.314 38.314 34 35 34 H25 V22 Z" fill="url(#pmf-accent)" fill-opacity="0.9" />

  <!-- Speed Fix Accent Notch -->
  <circle cx="51" cy="13" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
</svg>